[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "potify"
version = "1.0.0"
description = "Batch image resize and conversion utility for photos and images"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "POTify Team" }
]
dependencies = [
    "Pillow>=10.0.0",
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
potify = "main:main"

[project.urls]
Homepage = "https://github.com/GryAsl/POTify"
Repository = "https://github.com/GryAsl/POTify"
Issues = "https://github.com/GryAsl/POTify/issues"
Releases = "https://github.com/GryAsl/POTify/releases"
